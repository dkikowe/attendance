{% extends 'attendance_base.html' %}{% block content %}<section class="card narrow"><h1>Студент тіркеу</h1><form method="post"><label>Логин<input name="username" minlength="3" required></label><label>Құпиясөз<input name="password" type="password" minlength="8" required></label><label>Топ<select name="group_id" required>{% for g in groups %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}</select></label><button class="button">Тіркелу</button></form><p><a href="{{ url_for('login') }}">Кіру бетіне қайту</a></p></section>{% endblock %}
