{% extends 'attendance_base.html' %}{% block content %}<section class="card narrow"><h1>Student registration</h1><form method="post"><label>Username<input name="username" minlength="3" required></label><label>Password<input name="password" type="password" minlength="8" required></label><label>Group<select name="group_id" required>{% for g in groups %}<option value="{{ g.id }}">{{ g.name|english }}</option>{% endfor %}</select></label><button class="button">Register</button></form><p><a href="{{ url_for('login') }}">Back to sign in</a></p></section>{% endblock %}
