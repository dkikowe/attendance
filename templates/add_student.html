<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Жаңа студент қосу</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: 'Segoe UI', sans-serif; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 600px; width: 100%; background: rgba(255,255,255,0.95); padding: 40px; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .back-btn { display: inline-flex; align-items: center; padding: 12px 25px; background: linear-gradient(45deg, #e74c3c, #c0392b); color: white; text-decoration: none; border-radius: 25px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(231,76,60,0.3); margin-bottom: 30px; font-weight: 600; gap: 8px; }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(231,76,60,0.4); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; font-size: 2.2em; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #2c3e50; font-weight: 600; }
        input, select { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; transition: all 0.3s ease; background: white; }
        input:focus, select:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.1); }
        .submit-btn { width: 100%; padding: 15px; background: linear-gradient(45deg, #27ae60, #219a52); color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(39,174,96,0.3); margin-top: 20px; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(39,174,96,0.4); }
        .flash-success { background: linear-gradient(45deg, #27ae60, #219a52); color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .flash-error { background: linear-gradient(45deg, #e74c3c, #c0392b); color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn"><span>⬅</span>Артқа қайту</a>
        
        <h1>🎓 Жаңа студент қосу</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="/add_student">
            <div class="form-group">
                <label for="name">Аты-жөні:</label>
                <input type="text" id="name" name="name" required placeholder="Мысалы: Айгерім Қайратқызы">
            </div>
            
            <div class="form-group">
                <label for="gender">Жынысы:</label>
                <select id="gender" name="gender" required>
                    <option value="">Жынысын таңдаңыз</option>
                    <option value="Әйел">Әйел</option>
                    <option value="Ер">Ер</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="birthdate">Туған күні:</label>
                <input type="date" id="birthdate" name="birthdate" required>
            </div>
            
            <div class="form-group">
                <label for="faculty">Факультет:</label>
                <input type="text" id="faculty" name="faculty" required placeholder="Мысалы: Информатика">
            </div>
            
            <div class="form-group">
                <label for="phone">Телефон нөмірі:</label>
                <input type="tel" id="phone" name="phone" required placeholder="Мысалы: +7-777-123-45-67">
            </div>
            
            <div class="form-group">
                <label for="email">Электронды пошта:</label>
                <input type="email" id="email" name="email" required placeholder="Мысалы: student@university.kz">
            </div>
            
            <button type="submit" class="submit-btn">✅ Студентті қосу</button>
        </form>
    </div>
    
    <script>
        const today = new Date();
        const maxDate = new Date(today.getFullYear() - 16, today.getMonth(), today.getDate());
        document.getElementById('birthdate').max = maxDate.toISOString().split('T')[0];
        
        document.getElementById('birthdate').addEventListener('change', function() {
            const birthDate = new Date(this.value);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            
            if (age < 16) {
                alert('⚠️ Студенттің жасы кемінде 16 болуы керек!');
                this.value = '';
            }
        });
    </script>
</body>
</html>
